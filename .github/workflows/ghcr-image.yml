name: Build patched container image

on:
  push:
    branches:
      - develop
  schedule:
    # Rebuild after both forks' upstream-sync jobs so frontend-only updates
    # are embedded even when the backend branch itself did not change.
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/donetick

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out backend
        uses: actions/checkout@v4

      - name: Check out patched frontend
        uses: actions/checkout@v4
        with:
          repository: henriks/frontend
          ref: develop
          path: frontend-code

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 23
          cache: npm
          cache-dependency-path: frontend-code/package-lock.json

      - name: Build self-hosted frontend
        working-directory: frontend-code
        run: |
          npm ci
          npm run build -- --mode selfhosted

      - name: Stage embedded frontend
        run: |
          find frontend/dist -mindepth 1 -delete
          cp -R frontend-code/dist/. frontend/dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=patched
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
